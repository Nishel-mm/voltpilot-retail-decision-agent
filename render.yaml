services:
  - type: web
    name: voltpilot-retail-api-nishel
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FRONTEND_ORIGINS
        value: https://voltpilot-retail-web-nishel.onrender.com

  - type: web
    name: voltpilot-retail-web-nishel
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://voltpilot-retail-api-nishel.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
